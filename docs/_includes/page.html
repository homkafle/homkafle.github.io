{% unless page.url == "/" %}
<header class="page-heading">
  {% if page.eyebrow %}
  <p class="eyebrow">{{ page.eyebrow }}</p>
  {% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.tagline %}
  <p>{{ page.tagline }}</p>
  {% endif %}
</header>
{% endunless %}

<div class="page-content">
  {{ content }}
</div>
